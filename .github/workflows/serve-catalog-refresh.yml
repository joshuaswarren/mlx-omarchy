name: Refresh serve catalog availability

# Maintainer-side availability refresh for serve/mlx_omarchy_serve/
# catalog.json, on a schedule and always through a metadata-only pull
# request. The refresher (tools/refresh_serve_catalog.py) rewrites ONLY
# availability.size_bytes / availability.refreshed_at and the top-level
# generated_at; qualification, recommended, revision, priority, and every
# other vetted field are immutable by construction and verified by tests.
# Nothing auto-merges: a human reviews and merges the PR. Reads no
# secret: the Hugging Face metadata API is public and unauthenticated.
# The suite runs under the stdlib unittest runner (no install step); the
# publish flow lives in tools/serve_catalog_publish.sh and is exercised
# by tests/test_serve_catalog_refresh.py against a local git fixture.

on:
  schedule:
    - cron: "43 4 * * 1-5" # weekdays, off the top of the hour (UTC)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: serve-catalog-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the publish branch; nothing more
      pull-requests: write # open the metadata-only PR
    steps:
      - uses: actions/checkout@v4

      - name: Refresh availability from the Hugging Face metadata API
        # Exit 0 = clean refresh or pure verification pass (no write),
        # 3 = refreshed with upstream drift (revisions retained, drift
        # report in the log); all three proceed. Exit 1 (fetch error) or
        # 2 (invalid catalog) fails the job and leaves the committed
        # catalog untouched: last-known-good wins.
        run: |
          set -euo pipefail
          code=0
          python3 tools/refresh_serve_catalog.py \
            --catalog serve/mlx_omarchy_serve/catalog.json || code=$?
          case "$code" in
            0|3) echo "refresher exit $code" ;;
            *) exit "$code" ;;
          esac

      - name: Validate the refreshed catalog and run the catalog tests
        run: |
          python3 -m unittest tests.test_serve_catalog_refresh tests.test_serve_catalog_publish_flow -v

      - name: Publish metadata-only pull request
        run: |
          tools/serve_catalog_publish.sh \
            serve/mlx_omarchy_serve/catalog.json serve-catalog-refresh main
        env:
          GH_TOKEN: ${{ github.token }}
