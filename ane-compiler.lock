# Pinned external ANE compiler (plan sections 7-9, gate 46).
# The compiler stays a separate repository; this pin is the only source
# mlx-omarchy builds from. Release tooling never builds from a moving branch.
# The archive is the immutable release asset for the tagged commit: GitHub's
# codeload archive generation for this fork was unavailable at pin time.
# Commit a8392e6 (FFN mm1/mm2 measured linear layouts + device gate).
# Two commits on top of f122644, on branch ffn-mm2-plane:
#   (a8392e6) h13: measured FFN linear layouts — 256-plane permutation
#     (m375 k1024 n4096): P_half(g,c,L) = 16384*pi256(g) + c + 16L with
#     pi256(g) = (g & ~31) | ((g&15)<<1) | ((g>>4)&1); and the 8/8
#     column-split two-plane packing (m375 k4096 n1024): identity group
#     order, c<8 -> plane 2g, c>=8 -> plane 2g+1, lane stride 8.
#   (60e7c9c-era CRT measurement, receipt ane-linux-experiments
#     receipts/2026-09-17-ffn-mm2-plane.md)
#   scripts/dev_gate_ffn.py: device-execution gate on MINTED bundles for
#     both geometries (rngs 11/33/57, budget 0.05).
# Device-execution gate at pin (t6001-test-host): mm1 rel_l2 0.000208/0.000208/0.000208,
# mm2 0.000208/0.000207/0.000207 across rngs 11/33/57; as-emitted controls
# (pre-fix) 1.3704 / 1.4166. Byte-parity suite: 874/874 PASS.
# The two new geometry gates are (reduction, columns)-keyed exactly like the
# o-proj permutation; all other geometries keep identity packing, so the
# captured byte-parity oracles and the o-proj fix from f122644 are intact.
