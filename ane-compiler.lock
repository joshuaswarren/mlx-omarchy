# Pinned external ANE compiler (plan sections 7-9, gate 46).
# The compiler stays a separate repository; this pin is the only source
# mlx-omarchy builds from. Release tooling never builds from a moving branch.
# The archive is the immutable release asset for the tagged commit: GitHub's
# codeload archive generation for this fork was unavailable at pin time.
# Commit b61de46 (main with feature/strict-bind-surface-naming merged: every
# declared surface named in the task stream, and BinaryConstant surfaces
# staged contiguously across the decoded TD span) emits
# mil-hwxc.h13-anec-package.v2; prior archives are superseded and must not
# be re-accepted by the package adapter.
